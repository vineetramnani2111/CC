<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My AI Chatbot</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f2f2;
        }

        .chat-container {
            width: 90%;
            max-width: 700px;
            margin: 50px auto;
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
        }

        #chat {
            height: 400px;
            overflow-y: auto;
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
            background: #fafafa;
        }

        .message {
            margin: 10px 0;
        }

        .user {
            text-align: right;
        }

        .bot {
            text-align: left;
        }

        .input-area {
            display: flex;
            gap: 10px;
        }

        #message {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            background: #24292f;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #000;
        }
    </style>
</head>

<body>

    <div class="chat-container">

        <h1>🤖 My AI Chatbot</h1>

        <div id="chat">

            <div class="message bot">
                <strong>Bot:</strong> Hello! How can I help you?
            </div>

        </div>

        <div class="input-area">

            <input
                type="text"
                id="message"
                placeholder="Type your message..."
            >

            <button onclick="sendMessage()">
                Send
            </button>

        </div>

    </div>

    <script>

        function sendMessage() {

            const input = document.getElementById("message");
            const chat = document.getElementById("chat");

            const message = input.value.trim();

            if (message === "") {
                return;
            }

            chat.innerHTML += `
                <div class="message user">
                    <strong>You:</strong> ${message}
                </div>
            `;

            chat.innerHTML += `
                <div class="message bot">
                    <strong>Bot:</strong> I received your message!
                </div>
            `;

            input.value = "";

            chat.scrollTop = chat.scrollHeight;
        }

    </script>

</body>

</html>
