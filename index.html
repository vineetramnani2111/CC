<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CC Buddy</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 90%;
            max-width: 700px;
            margin: 50px auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
        }

        #chat {
            height: 400px;
            overflow-y: auto;
            border: 1px solid #ddd;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 8px;
        }

        .message {
            margin: 10px 0;
            padding: 10px;
            border-radius: 8px;
        }

        .user {
            background: #e3f2fd;
        }

        .bot {
            background: #eeeeee;
        }

        .input-area {
            display: flex;
            gap: 10px;
        }

        #messageInput {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            background: #24292e;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #444;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>CC Buddy</h1>

        <div id="chat">
            <div class="message bot">
                <strong>Bot:</strong> Hello! I'm CC Buddy. How can I help you?
            </div>
        </div>

        <div class="input-area">
            <input
                type="text"
                id="messageInput"
                placeholder="Type your message..."
            >

            <button onclick="sendMessage()">
                Send
            </button>
        </div>

    </div>

    <script>

        function sendMessage() {

            const input = document.getElementById("messageInput");
            const chat = document.getElementById("chat");

            const message = input.value.trim();

            if (message === "") {
                return;
            }

            // Show user's message
            chat.innerHTML += `
                <div class="message user">
                    <strong>You:</strong> ${message}
                </div>
            `;

            // Temporary bot response
            chat.innerHTML += `
                <div class="message bot">
                    <strong>Bot:</strong> I received your message!
                </div>
            `;

            // Clear input
            input.value = "";

            // Scroll to latest message
            chat.scrollTop = chat.scrollHeight;
        }

    </script>

</body>
</html>
